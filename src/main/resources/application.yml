# Base configuration: production-safe defaults. Profiles (dev, prod) layer on top.
spring:
  application:
    name: candidate-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/candidates}
    username: ${DB_USERNAME:candidates}
    password: ${DB_PASSWORD:candidates}
    hikari:
      pool-name: candidates-pool
      maximum-pool-size: 10
      # Fail fast instead of piling up request threads when the DB is slow or down.
      connection-timeout: 3000
      # Guard rail: no single statement may run longer than 5s (protects the DB from runaway searches).
      connection-init-sql: SET statement_timeout = '5s'
      data-source-properties:
        # Client-side guards (seconds): a hung network path cannot block a request thread forever.
        connectTimeout: 3
        socketTimeout: 30

  jpa:
    # Never hold a DB connection while rendering the response; lazy loading outside services is a bug.
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only verifies that the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        # Loads the skills of a whole result page in one query instead of one query per candidate (N+1).
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  jackson:
    deserialization:
      # Strict contract: typos and fields that do not belong to an operation are rejected with 400.
      fail-on-unknown-properties: true
    time-zone: UTC

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  server:
    # Operational endpoints live on a separate port that is not exposed publicly.
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

app:
  security:
    # Required. Comma-separated; every key must be at least 16 characters. The app refuses to start without one.
    api-keys: ${API_KEYS:}
  web:
    max-request-body-size: 1MB
